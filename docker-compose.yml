services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: theodesmond
      POSTGRES_USER: theo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theo -d theodesmond"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://theo:${DB_PASSWORD}@db:5432/theodesmond
      PORT: 3001
    volumes:
      - uploads:/app/uploads
      - aurex-workspaces:/app/aurex-workspaces

volumes:
  pgdata:
  uploads:
  aurex-workspaces: